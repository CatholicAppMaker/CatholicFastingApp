name: iOS Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  source-quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift source-quality tools
        run: brew install swiftformat swiftlint
      - name: Verify formatting
        run: swiftformat . --lint
      - name: Verify lint
        run: swiftlint lint --config .swiftlint.yml --strict --no-cache

  swift-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift test
        run: swift test -Xswiftc -warnings-as-errors

  ios-ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic iOS UI tests
        run: |
          chmod +x scripts/run_ios_tests.sh
          ./scripts/run_ios_tests.sh
      - name: Upload xcresult bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresults
          path: /tmp/CatholicFastingAppTestResults/*.xcresult
